name: Deploy auf GitHub Pages

on:
  push:
    branches:
      - main
      - claude/nextjs-spa-glassmorphism-awazb8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig zulassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versucht, GitHub Pages selbst einzuschalten. Der Workflow-Token darf das
      # nur, wenn Pages bereits einmal aktiviert wurde – deshalb blockiert ein
      # Fehlschlag hier den Build nicht. Falls der Deploy-Schritt mit 404
      # abbricht, muss Pages einmalig unter
      # Settings → Pages → Source: „GitHub Actions" gesetzt werden.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Statischen Export bauen
        env:
          NEXT_OUTPUT: export
          # GitHub Pages liefert das Projekt unter /<repo> aus.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Testdomain nicht indexieren lassen – vor dem Livegang auf der echten Domain entfernen.
          NEXT_PUBLIC_NOINDEX: 'true'
          # Anbindung des Anfrageformulars. Der anon key ist öffentlich – er
          # landet ohnehin im ausgelieferten JavaScript –, gehört aber trotzdem
          # in die Repository-Variablen und nicht in den Quelltext.
          # Fehlt eine der beiden, übergibt das Formular an E-Mail und WhatsApp.
          NEXT_PUBLIC_SUPABASE_URL: https://ipbtvvnqrqxpgcoycqbj.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
