name: Deploy auf GitHub Pages

on:
  push:
    branches:
      - main
      - claude/nextjs-spa-glassmorphism-awazb8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig zulassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versucht, GitHub Pages selbst einzuschalten. Der Workflow-Token darf das
      # nur, wenn Pages bereits einmal aktiviert wurde – deshalb blockiert ein
      # Fehlschlag hier den Build nicht. Falls der Deploy-Schritt mit 404
      # abbricht, muss Pages einmalig unter
      # Settings → Pages → Source: „GitHub Actions" gesetzt werden.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Der gesamte Livegang hängt an einer einzigen Repository-Variablen:
      # Settings → Secrets and variables → Actions → Variables → SITE_DOMAIN.
      # Ist sie leer, läuft die Seite auf der Testadresse von GitHub Pages,
      # unter /<repo> und mit Indexierungssperre. Steht die echte Domain darin,
      # liegt die Seite in der Wurzel, trägt ihre eigenen Adressen und darf in
      # den Index. Am Code ist dafür nichts zu ändern.
      - name: Statischen Export bauen
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_DOMAIN == '' && format('/{0}', github.event.repository.name) || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_DOMAIN != '' && format('https://{0}', vars.SITE_DOMAIN) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXT_PUBLIC_NOINDEX: ${{ vars.SITE_DOMAIN == '' && 'true' || '' }}
        run: |
          npm run build
          touch out/.nojekyll

      # GitHub Pages erkennt die eigene Domain an dieser Datei im Auslieferungsordner.
      - name: Eigene Domain hinterlegen
        if: vars.SITE_DOMAIN != ''
        run: echo "${{ vars.SITE_DOMAIN }}" > out/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
