AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Anfrageformular der Website Kevin Garrison. Eine Lambda-Funktion nimmt die
  Anfrage entgegen, prüft sie und schickt sie per SES weiter. Keine Datenbank,
  kein Speicher – die Fotos hängen an der E-Mail.

Parameters:
  Absender:
    Type: String
    Description: >
      Absenderadresse der Benachrichtigung, zum Beispiel website@ihre-domain.de.
      Muss in SES verifiziert sein (Adresse oder ganze Domain).
  Empfaenger:
    Type: String
    Description: >
      Adresse, an die die Anfragen gehen. Solange das SES-Konto in der Sandbox
      ist, muss auch sie verifiziert sein.
  ErlaubteHerkunft:
    Type: String
    Default: ''
    Description: >
      Komma-Liste der Domains, von denen das Formular senden darf, zum Beispiel
      https://kevin-garrison.de,https://www.kevin-garrison.de
      Leer lassen heißt: jede Herkunft ist erlaubt.

Resources:
  AnfrageFunktion:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: garrison-anfrage
      Description: Nimmt Anfragen aus dem Kontaktformular an und leitet sie per SES weiter.
      CodeUri: lambda/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          MAIL_VON: !Ref Absender
          MAIL_AN: !Ref Empfaenger
          ERLAUBTE_HERKUNFT: !Ref ErlaubteHerkunft
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: [POST, OPTIONS]
          AllowHeaders: [content-type]
          MaxAge: 86400
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  # Aufräumen: Logs nicht ewig aufbewahren.
  AnfrageLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AnfrageFunktion}
      RetentionInDays: 30

Outputs:
  FormularEndpunkt:
    Description: >
      Diese Adresse gehört in NEXT_PUBLIC_FORM_ENDPOINT.
    Value: !GetAtt AnfrageFunktionUrl.FunctionUrl
